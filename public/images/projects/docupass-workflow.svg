  <g fill="#B6C8CD" font-family="Arial,sans-serif" font-size="17">
    <text x="104" y="612"><tspan x="104" dy="0">Images, PDFs or folders.</tspan><tspan x="104" dy="25">Choose the pages and</tspan><tspan x="104" dy="25">document mode.</tspan></text>
    <text x="425" y="612"><tspan x="425" dy="0">Select language and model.</tspan><tspan x="425" dy="25">Check CPU, memory and</tspan><tspan x="425" dy="25">supported GPU runtime.</tspan></text>
    <text x="746" y="612"><tspan x="746" dy="0">Parallel workers show</tspan><tspan x="746" dy="25">progress and an estimate.</tspan><tspan x="746" dy="25">A failed file won't stop all.</tspan></text>
    <text x="1067" y="612"><tspan x="1067" dy="0">Compare fields with the</tspan><tspan x="1067" dy="25">source; correct uncertain</tspan><tspan x="1067" dy="25">values, then save results.</tspan></text>
